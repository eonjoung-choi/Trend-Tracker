name: 📰 뉴스 자동 업데이트

on:
  # ★ 외부 스케줄러(cron-job.org 등)가 정시에 트리거 — repository_dispatch
  #   POST https://api.github.com/repos/<owner>/<repo>/dispatches  body: {"event_type":"run-news"}
  repository_dispatch:
    types: [run-news]
  schedule:
    # 백업용 — 외부 스케줄러 실패 대비 (GitHub 크론은 지연될 수 있음)
    # 매일 오전 6시 8분 KST = UTC 21:08 (전날)
    - cron: '8 21 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: pip install feedparser requests

      - name: 🔄 뉴스 수집 및 업데이트
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/update_news.py

      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          git diff --cached --quiet || git commit -m "📰 뉴스 자동 업데이트 $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push
