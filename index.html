<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trend Tracker</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F6F8;--surface:#FFF;--border:#ECEEF1;
  --t1:#191F28;--t2:#4E5968;--t3:#8B95A1;
  --accent:#3182F6;--accent-bg:#EBF3FE;
  --red:#F04452;--red-bg:#FFF0F1;
  --green:#00B386;--green-bg:#E8FAF5;
  --orange:#FF6B2C;--orange-bg:#FFF3ED;
  --purple:#8B5CF6;--purple-bg:#F3F0FF;
  --amber:#B45309;--amber-bg:#FFFBEB;
  --r:12px;
}
body{font-family:'Pretendard Variable',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--t1);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}

/* ── HEADER ── */
.hd{background:var(--surface);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 16px 14px}
.hd-left{display:flex;flex-direction:column;gap:9px;min-width:0}
.hd-title-row{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo{font-size:28px;font-weight:900;letter-spacing:-1px;color:var(--t1);white-space:nowrap;line-height:1.15}
.hd-sub{font-size:14.5px;font-weight:600;color:var(--t1);white-space:nowrap}
.hd-date{font-size:13.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.hd-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-btn{width:34px;height:34px;margin-top:2px;border-radius:50%;border:none;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:.15s;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 8px rgba(49,130,246,.3)}
.search-btn:active{background:#1B64DA}
.search-bar{overflow:hidden;max-height:0;transition:max-height .25s ease,margin .25s ease,opacity .25s ease;opacity:0;margin-top:0;position:relative;padding:0 16px}
.search-bar.open{max-height:56px;opacity:1;margin-top:10px}
.search-bar input{width:100%;padding:10px 38px 10px 38px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--t1);outline:none;transition:.2s}
.search-bar input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-bg)}
.search-bar input::placeholder{color:var(--t3)}
.search-bar svg.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--t3)}
.search-clear{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;background:var(--t3);color:#fff;border-radius:50%;font-size:12px;line-height:20px;text-align:center;cursor:pointer;display:none;padding:0;font-family:inherit;-webkit-tap-highlight-color:transparent}
.search-clear.show{display:flex;align-items:center;justify-content:center}

/* ── TABS (국내/해외) ── */
.tab-bar{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;white-space:nowrap;padding:14px 8px;font-size:16.5px;font-weight:500;color:var(--t3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:inherit;transition:.15s;min-height:50px}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab-btn .cnt{font-size:12px;font-weight:600;margin-left:5px;padding:1px 7px;border-radius:100px;background:var(--bg);color:var(--t3)}
.tab-btn.on .cnt{background:var(--accent-bg);color:var(--accent)}
.tab-btn .cnt.dot,.tab-btn.on .cnt.dot{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;padding:0 5px;margin-left:6px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.info-dot{flex:0 0 auto;align-self:center;margin-left:auto;width:24px;height:24px;border:none;background:none;color:var(--t3);font-size:15px;cursor:pointer;line-height:1}
.cnt-help{padding:9px 16px;font-size:12.5px;color:var(--t3);background:var(--accent-bg);border-bottom:1px solid var(--border);line-height:1.45}

/* ── FEED ── */
.feed{padding:8px 12px 100px}
.date-label{font-size:13px;font-weight:600;color:var(--t3);padding:20px 4px 10px;position:sticky;top:146px;background:var(--bg);z-index:10}
.card{background:var(--surface);border-radius:var(--r);padding:20px 18px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.985);background:#FAFBFC}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:700;white-space:nowrap}
.type{display:inline-flex;padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:500;white-space:nowrap}
.t-new{background:var(--accent-bg);color:var(--accent)}.t-update{background:var(--green-bg);color:var(--green)}.t-event{background:var(--orange-bg);color:var(--orange)}.t-policy{background:var(--purple-bg);color:var(--purple)}.t-ux{background:var(--amber-bg);color:var(--amber)}
.t-partner{background:#E0F2FE;color:#0369A1}.t-tech{background:#EEF2FF;color:#4F46E5}.t-trend{background:#FFF1F2;color:#BE123C}
.card-title{font-size:17px;font-weight:600;line-height:1.45;color:var(--t1);margin-bottom:7px;word-break:keep-all;overflow-wrap:anywhere}
.card-desc{font-size:14.5px;color:var(--t2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.tags{display:flex;gap:5px;flex-wrap:nowrap;min-width:0;overflow:hidden}
.tag{font-size:12.5px;padding:5px 11px;background:var(--bg);color:var(--t3);border-radius:100px;white-space:nowrap}
.card-date{font-size:13px;color:var(--t3);white-space:nowrap;flex-shrink:0;margin-left:8px}
.impact{font-size:10px;padding:4px 10px;border-radius:100px;font-weight:600;white-space:nowrap}
.imp-h{background:var(--red-bg);color:var(--red)}

/* ── SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:101;background:var(--surface);border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0)}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 6px;flex-shrink:0}
.sheet-head{padding:6px 16px 12px;display:flex;align-items:flex-start;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
#shHead{flex-shrink:0}
.sheet-head-info{flex:1;min-width:0}
.sheet-close{width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;font-size:18px;color:var(--t3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.sheet-body{padding:0 16px 32px}
.sh-section{margin-bottom:20px}
.sh-label{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sh-label-icon{font-size:16px}
.sh-text{font-size:15.5px;color:var(--t1);line-height:1.75}
.sh-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sh-tag{font-size:13.5px;padding:8px 17px;background:var(--accent-bg);color:var(--accent);border-radius:100px;font-weight:600;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.15s;border:none;font-family:inherit}
.sh-tag:active{background:#D0E3FC}
.sh-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:var(--bg);border-radius:var(--r);margin-bottom:20px}
.sh-meta-item{display:flex;flex-direction:column;gap:2px}
.sh-meta-item small{font-size:12.5px;color:var(--t3)}
.sh-meta-item strong{font-size:15px;font-weight:600}
.sh-sources{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.src-btn{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--t1);font-size:15px;font-weight:500;transition:.15s;-webkit-tap-highlight-color:transparent;min-height:50px}
.src-btn:active{background:var(--border)}
.src-btn-left{display:flex;align-items:center;gap:8px}
.src-type-badge{font-size:12px;padding:4px 11px;border-radius:100px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.src-arrow{color:var(--t3);font-size:16px;flex-shrink:0}
.b-kakao{background:#FEE500;color:#191919}.b-toss{background:#0064FF;color:#fff}.b-naver{background:#03C75A;color:#fff}.b-coupang{background:#E31837;color:#fff}.b-shinhan{background:#0046FF;color:#fff}.b-kb{background:#FFBC00;color:#191919}.b-samsung{background:#1428A0;color:#fff}.b-hyundai{background:#1A1A1A;color:#fff}.b-woori{background:#0066B3;color:#fff}.b-baemin{background:#2AC1BC;color:#fff}.b-kurly{background:#5F0080;color:#fff}.b-musinsa{background:#111;color:#fff}.b-carrot{background:#FF6F0F;color:#fff}.b-zigzag{background:#FF2D78;color:#fff}.b-ssg{background:#FF5452;color:#fff}.b-lotte{background:#E60012;color:#fff}.b-gmarket{background:#00A650;color:#fff}.b-11st{background:#FF0000;color:#fff}.b-oliveyoung{background:#9CC846;color:#fff}.b-ably{background:#FF6243;color:#fff}.b-daiso{background:#E40046;color:#fff}.b-hana{background:#009490;color:#fff}.b-kakaobank{background:#FFCD00;color:#191919}.b-kbank{background:#4046D6;color:#fff}.b-payco{background:#FF1717;color:#fff}.b-lottecard{background:#ED1C24;color:#fff}
.b-kbbank{background:#FFB200;color:#191919}.b-shinhanbank{background:#0046FF;color:#fff}.b-hanabank{background:#008B85;color:#fff}.b-wooribank{background:#0067AC;color:#fff}.b-nh{background:#1EA64A;color:#fff}.b-ibk{background:#004C97;color:#fff}.b-bnk{background:#E4002B;color:#fff}
.b-visa{background:#1A1F71;color:#fff}.b-mc{background:#EB001B;color:#fff}.b-paypal{background:#003087;color:#fff}.b-stripe{background:#635BFF;color:#fff}.b-alipay{background:#1677FF;color:#fff}.b-wechat{background:#07C160;color:#fff}.b-klarna{background:#FFB3C7;color:#191919}.b-revolut{background:#191919;color:#fff}.b-amex{background:#006FCF;color:#fff}
.b-wiseapp{background:#6D28D9;color:#fff}.b-mobileindex{background:#2563EB;color:#fff}.b-nielsen{background:#11468F;color:#fff}.b-bok{background:#0A2D6E;color:#fff}.b-market{background:#64748B;color:#fff}
.more{display:block;width:100%;margin:8px 0 4px;padding:16px;border:1px solid var(--border);background:var(--surface);color:var(--t2);border-radius:var(--r);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.15s}
.more:active{background:var(--bg)}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}.empty p{font-size:15px;margin-top:8px}
@supports(padding-bottom:env(safe-area-inset-bottom)){.feed{padding-bottom:calc(100px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-top">
    <div class="hd-left">
      <div class="hd-title-row">
        <div class="logo" onclick="goHome()" style="cursor:pointer">Trend Tracker</div>
        <span class="hd-date" id="dateLabel"></span>
      </div>
      <div class="hd-sub">국내외 금융사 동향 트래킹</div>
    </div>
    <div class="hd-right">
      <button class="search-btn" onclick="toggleSearch()" aria-label="검색">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>
  </div>
  <div class="search-bar" id="searchBar">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="q" type="text" placeholder="브랜드, 키워드 검색..." oninput="onSearchInput()">
    <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="검색어 삭제">✕</button>
  </div>
  <div class="tab-bar" id="tabBar"></div>
  <div id="cntHelp" class="cnt-help" hidden>ⓘ 숫자는 <b>오늘 새로 수집된 뉴스 수</b>예요 · 기사 발행일이 아닌 '수집일' 기준</div>
</header>

<div class="feed" id="feed"></div>
<div class="overlay" id="ov" onclick="close_sheet()"></div>
<div class="sheet" id="sh"><div class="sheet-handle"></div><div id="shHead"></div><div id="shBody" class="sheet-scroll"></div></div>

<script>
let D=[];
const REGION_TABS=["국내","해외"];
let region="국내";
const PAGE=30;let shown=PAGE;

/* ── 데이터 로드: news_data.json에서 fetch ── */
(async function loadData(){
  try{
    const res=await fetch('news_data.json?t='+Date.now());
    if(!res.ok) throw new Error('fetch failed: '+res.status);
    const json=await res.json();
    D=Array.isArray(json)?json:(json.items||[]);
  }catch(e){
    console.warn('news_data.json 로드 실패, 로컬 fallback 확인:',e.message);
    /* file:// 프로토콜 등에서 fetch 실패 시 빈 상태 유지 */
    document.getElementById('feed').innerHTML='<div class="empty"><p>뉴스 데이터를 불러올 수 없습니다.<br>GitHub Pages 배포 후 정상 작동합니다.</p></div>';
  }
  initApp();
})();

function fmtDateFull(ds){const d=new Date(ds);return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function fmtRelative(ds){const d=new Date(ds+'T00:00:00+09:00'),now=new Date(),kst=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Seoul'})),diff=Math.floor((new Date(kst.getFullYear(),kst.getMonth(),kst.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);if(diff===0)return"오늘";if(diff===1)return"어제";if(diff<7)return diff+"일 전";return`${d.getMonth()+1}월 ${d.getDate()}일`}
function dateGroup(ds){const d=new Date(ds+'T00:00:00+09:00'),now=new Date(),kst=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Seoul'})),diff=Math.floor((new Date(kst.getFullYear(),kst.getMonth(),kst.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);if(diff===0)return"오늘";if(diff===1)return"어제";if(diff<7)return"이번 주";if(diff<14)return"지난 주";return`${d.getMonth()+1}월`}

function regionOf(x){return x.region||"국내";}
function todayKST(){const k=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));return`${k.getFullYear()}-${String(k.getMonth()+1).padStart(2,'0')}-${String(k.getDate()).padStart(2,'0')}`;}
function toggleCntHelp(e){e.stopPropagation();const el=document.getElementById('cntHelp');el.hidden=!el.hidden;}

function getFiltered(){
  const q=document.getElementById('q').value.toLowerCase();
  let list=D.filter(x=>{
    if(x.isEvent)return false;
    if(regionOf(x)!==region)return false;
    if(q&&!(x.title.toLowerCase().includes(q)||x.brand.toLowerCase().includes(q)||x.tags.some(t=>t.toLowerCase().includes(q))))return false;
    return true;
  });
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return list;
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const qok=x=>!q||(x.title.toLowerCase().includes(q)||x.brand.toLowerCase().includes(q)||x.tags.some(t=>t.toLowerCase().includes(q)));
  const today=todayKST();
  document.getElementById('tabBar').innerHTML=REGION_TABS.map(r=>{
    const n=D.filter(x=>!x.isEvent&&regionOf(x)===r&&qok(x)&&x.added===today).length;
    const badge=n>0?`<span class="cnt dot">${n}</span>`:'';
    return`<button class="tab-btn${region===r?' on':''}" onclick="region='${r}';shown=PAGE;render()">${r}${badge}</button>`;
  }).join('')+`<button class="info-dot" onclick="toggleCntHelp(event)" aria-label="배지 안내">ⓘ</button>`;
  const list=getFiltered();
  let html='',lg='';
  if(!list.length){html='<div class="empty"><p>조건에 맞는 항목이 없습니다</p></div>';}
  else{list.slice(0,shown).forEach(x=>{
    const g=dateGroup(x.date);
    if(g!==lg){html+=`<div class="date-label">${g}</div>`;lg=g;}
    html+=`<div class="card" onclick="open_sheet(${x.id})"><div class="card-top">${x.brand==='시장 동향'?'':`<span class="brand ${x.bc}">${x.brand}</span>`}<span class="type ${x.tc}">${x.type}</span></div><div class="card-title">${x.title}</div><div class="card-desc">${x.summary||x.desc}</div><div class="card-foot"><div class="tags">${x.tags.slice(0,3).map(t=>`<span class="tag">#${t}</span>`).join('')}</div><span class="card-date">${fmtRelative(x.date)}</span></div></div>`;
  });
    if(list.length>shown){html+=`<button class="more" onclick="shown+=PAGE;render()">더 보기 (남은 ${list.length-shown}건)</button>`;}
  }
  document.getElementById('feed').innerHTML=html;
}

function open_sheet(id){
  const x=D.find(d=>d.id===id);if(!x)return;
  document.getElementById('shHead').innerHTML=`
    <div class="sheet-head"><div class="sheet-head-info"><div class="card-top" style="margin-bottom:10px">${x.brand==='시장 동향'?'':`<span class="brand ${x.bc}">${x.brand}</span>`}<span class="type ${x.tc}">${x.type}</span></div><div style="font-size:19px;font-weight:700;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere">${x.title}</div></div><button class="sheet-close" onclick="close_sheet()">✕</button></div>`;
  document.getElementById('shBody').scrollTop=0;
  document.getElementById('shBody').innerHTML=`
    <div class="sheet-body">
      <div class="sh-meta">
        <div class="sh-meta-item"><small>발표일</small><strong>${fmtDateFull(x.date)}</strong></div>
        <div class="sh-meta-item"><small>사용자 영향도</small><strong>${x.il}</strong></div>
      </div>
      ${x.detail?`<div class="sh-section"><div class="sh-label"><span class="sh-label-icon">📌</span> 무엇이 달라졌나요?</div><div class="sh-text">${x.detail}</div></div>`:''}
      ${x.impact_text?`<div class="sh-section"><div class="sh-label"><span class="sh-label-icon">👤</span> 사용자에게 어떤 영향이 있나요?</div><div class="sh-text">${x.impact_text}</div></div>`:''}
      ${x.why?`<div class="sh-section"><div class="sh-label"><span class="sh-label-icon">💡</span> 실무에서 참고할 포인트</div><div class="sh-text">${x.why}</div></div>`:''}
      <div class="sh-section"><div class="sh-label"><span class="sh-label-icon">🏷️</span> 태그</div><div class="sh-tags">${x.tags.map(t=>`<button class="sh-tag" onclick="filterByTag('${t}')">#${t}</button>`).join('')}</div></div>
      <div class="sh-section"><div class="sh-label"><span class="sh-label-icon">🔗</span> 출처 바로가기</div><div class="sh-sources">${(()=>{const s=x.src[0];return `<a href="${s.url}" target="_blank" rel="noopener" class="src-btn"><div class="src-btn-left"><span class="src-type-badge">${s.ty}</span><span>${s.t}</span></div><span class="src-arrow">→</span></a>`})()}</div></div>
    </div>`;
  document.getElementById('ov').classList.add('on');
  document.getElementById('sh').classList.add('on');
  document.body.style.overflow='hidden';
}

function close_sheet(){document.getElementById('ov').classList.remove('on');document.getElementById('sh').classList.remove('on');document.body.style.overflow='';}
function goHome(){region='국내';shown=PAGE;document.getElementById('q').value='';document.getElementById('searchClear').classList.remove('show');const sb=document.getElementById('searchBar');if(sb.classList.contains('open'))sb.classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
function onSearchInput(){const v=document.getElementById('q').value;document.getElementById('searchClear').classList.toggle('show',v.length>0);shown=PAGE;render();}
function clearSearch(){document.getElementById('q').value='';document.getElementById('searchClear').classList.remove('show');document.getElementById('q').focus();shown=PAGE;render();}
function toggleSearch(){const b=document.getElementById('searchBar');b.classList.toggle('open');if(b.classList.contains('open'))document.getElementById('q').focus();else{document.getElementById('q').value='';document.getElementById('searchClear').classList.remove('show');shown=PAGE;render();}}
function filterByTag(tag){close_sheet();document.getElementById('q').value=tag;document.getElementById('searchClear').classList.add('show');shown=PAGE;const sb=document.getElementById('searchBar');if(!sb.classList.contains('open'))sb.classList.add('open');render();window.scrollTo({top:0,behavior:'smooth'});}

function initApp(){
  const now=new Date();
  document.getElementById('dateLabel').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  render();
}

let touchY=0;
document.getElementById('sh').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
document.getElementById('sh').addEventListener('touchmove',e=>{if(e.touches[0].clientY-touchY>80&&document.getElementById('shBody').scrollTop<=0)close_sheet();},{passive:true});
</script>
